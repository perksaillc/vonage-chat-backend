<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chat dashboard</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; height: 100vh; }
  #login { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #login form { width: 280px; display: flex; flex-direction: column; gap: 10px; }
  #login input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #login button { padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #login .error { color: #d33; font-size: 13px; }
  #app { display: none; height: 100vh; }
  #sidebar { width: 300px; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  #sidebar-header { padding: 12px 16px; border-bottom: 1px solid #eee; }
  #sidebar-header .who { font-size: 13px; color: #666; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  #sidebar-header .who button { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 12px; padding: 0; }
  #presence { font-size: 11px; color: #888; margin-bottom: 8px; }
  #search { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  #session-list { flex: 1; overflow-y: auto; }
  .session { padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .session:hover { background: #f5f5f5; }
  .session.active { background: #e8f0fe; }
  .session.closed { opacity: 0.55; }
  .session .left { min-width: 0; flex: 1; }
  .session .name { font-weight: 600; font-size: 14px; }
  .session .preview { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session .badge { background: #2563eb; color: #fff; font-size: 11px; border-radius: 999px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px; flex-shrink: 0; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #thread-header { padding: 10px 16px; border-bottom: 1px solid #eee; font-size: 13px; color: #666; display: none; justify-content: space-between; align-items: center; }
  #thread-header button { font-size: 12px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
  .msg { max-width: 60%; margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
  .msg.visitor { background: #f0f0f0; align-self: flex-start; }
  .msg.agent { background: #2563eb; color: #fff; margin-left: auto; }
  .msg.system { align-self: center; background: none; color: #999; font-style: italic; font-size: 12px; }
  .msg .meta { font-size: 10px; opacity: 0.7; margin-top: 3px; }
  #composer { display: none; padding: 12px; border-top: 1px solid #ddd; gap: 8px; }
  #composer input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #composer button { margin-left: 8px; padding: 10px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #empty { padding: 24px; color: #888; }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h3 style="margin:0 0 4px;">Agent login</h3>
    <input id="loginUser" placeholder="Username" autocomplete="username" />
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <div class="error" id="loginError"></div>
  </form>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <div class="who">
        <span id="whoami"></span>
        <button id="signOutBtn">Sign out</button>
      </div>
      <div id="presence"></div>
      <input id="search" placeholder="Search conversations..." />
    </div>
    <div id="session-list"></div>
  </div>
  <div id="main">
    <div id="thread-header">
      <span id="threadStatus"></span>
    </div>
    <div id="thread"><div id="empty">Select a conversation</div></div>
    <div id="composer">
      <input id="replyInput" placeholder="Type a reply..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('agentToken');
  let agentName = localStorage.getItem('agentName');
  let ws = null;

  let sessions = {};
  let activeId = null;
  let activeMessages = [];
  let viewingMap = {}; // sessionId -> agentName currently viewing it
  let searchMode = false;

  function fmtTime(ts) {
    const d = new Date(ts);
    return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function showApp() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('whoami').textContent = agentName || '';
    connectWs();
  }

  if (token && agentName) showApp();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      const res = await fetch('/agent/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Login failed'; return; }
      token = data.token; agentName = data.name;
      localStorage.setItem('agentToken', token);
      localStorage.setItem('agentName', agentName);
      showApp();
    } catch (err) {
      errEl.textContent = 'Could not reach server';
    }
  });

  document.getElementById('signOutBtn').onclick = async () => {
    try { await fetch('/agent/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }); } catch {}
    localStorage.removeItem('agentToken');
    localStorage.removeItem('agentName');
    location.reload();
  };

  function connectWs() {
    const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${wsProtocol}://${location.host}/agent-ws?token=${token}`);

    ws.onclose = () => {
      // token likely expired (server restarted) — send back to login
      document.getElementById('app').style.display = 'none';
      document.getElementById('login').style.display = 'flex';
      localStorage.removeItem('agentToken');
      localStorage.removeItem('agentName');
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'init') {
        msg.sessions.forEach(s => sessions[s.sessionId] = s);
        renderSidebar();
      }

      if (msg.type === 'session_update') {
        sessions[msg.session.sessionId] = msg.session;
        renderSidebar();
      }

      if (msg.type === 'presence') {
        document.getElementById('presence').textContent = msg.agents.length
          ? 'Online: ' + msg.agents.join(', ') : '';
      }

      if (msg.type === 'viewing') {
        viewingMap[msg.sessionId] = msg.agentName;
      }

      if (msg.type === 'message') {
        sessions[msg.sessionId] = sessions[msg.sessionId] || { sessionId: msg.sessionId };
        sessions[msg.sessionId].lastMessage = msg.text;
        sessions[msg.sessionId].lastFrom = msg.from;
        sessions[msg.sessionId].lastActivity = msg.ts;
        if (msg.name) sessions[msg.sessionId].name = msg.name;
        renderSidebar();

        if (msg.sessionId === activeId) {
          activeMessages.push(msg);
          renderThread();
        }
      }

      if (msg.type === 'history') {
        if (msg.sessionId === activeId) {
          activeMessages = msg.messages;
          renderThread();
        }
      }
    };
  }

  function renderSidebar() {
    const el = document.getElementById('session-list');
    const list = Object.values(sessions).sort((a, b) => (b.lastActivity || 0) - (a.lastActivity || 0));
    el.innerHTML = list.map(s => `
      <div class="session ${s.sessionId === activeId ? 'active' : ''} ${s.closed ? 'closed' : ''}" data-id="${s.sessionId}">
        <div class="left">
          <div class="name">${s.name || 'Visitor'}${s.closed ? ' (closed)' : ''}</div>
          <div class="preview">${s.lastFrom === 'agent' ? 'You: ' : ''}${(s.lastMessage || '').replace(/</g,'&lt;')}</div>
        </div>
        ${s.unread ? `<div class="badge">${s.unread}</div>` : ''}
      </div>
    `).join('');
    el.querySelectorAll('.session').forEach(node => {
      node.onclick = () => openSession(node.dataset.id);
    });
  }

  function openSession(sessionId) {
    activeId = sessionId;
    activeMessages = [];
    document.getElementById('composer').style.display = 'flex';
    document.getElementById('thread-header').style.display = 'flex';
    const s = sessions[sessionId];
    document.getElementById('threadStatus').textContent = s && s.closed ? 'Closed conversation' : '';
    ws.send(JSON.stringify({ type: 'get_history', sessionId }));
    ws.send(JSON.stringify({ type: 'join', sessionId }));
    if (sessions[sessionId]) sessions[sessionId].unread = 0;
    renderSidebar();
    renderThread();
  }

  function renderThread() {
    const el = document.getElementById('thread');
    el.innerHTML = activeMessages.map(m => {
      if (m.from === 'system') {
        return `<div class="msg system">${(m.text || '').replace(/</g,'&lt;')}</div>`;
      }
      const label = m.from === 'agent' ? (m.agentName || 'Agent') : (sessions[activeId]?.name || 'Visitor');
      return `<div class="msg ${m.from}">${(m.text || '').replace(/</g,'&lt;')}<div class="meta">${label} · ${fmtTime(m.ts)}</div></div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  }

  function sendReply() {
    const input = document.getElementById('replyInput');
    const text = input.value.trim();
    if (!text || !activeId) return;
    ws.send(JSON.stringify({ type: 'reply', sessionId: activeId, text }));
    input.value = '';
  }

  document.getElementById('sendBtn').onclick = sendReply;
  document.getElementById('replyInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendReply();
  });

  // ---- Search ----
  let searchTimer = null;
  document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if (!q) { searchMode = false; renderSidebar(); return; }
    searchTimer = setTimeout(async () => {
      const res = await fetch('/agent/search?q=' + encodeURIComponent(q), { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) return;
      const results = await res.json();
      const el = document.getElementById('session-list');
      el.innerHTML = results.map(r => `
        <div class="session" data-id="${r.sessionId}">
          <div class="left">
            <div class="name">${r.name || 'Visitor'}</div>
            <div class="preview">${(r.text || '').replace(/</g,'&lt;')}</div>
          </div>
        </div>
      `).join('') || '<div style="padding:16px;color:#888;font-size:13px;">No matches</div>';
      el.querySelectorAll('.session').forEach(node => {
        node.onclick = () => { document.getElementById('search').value = ''; openSession(node.dataset.id); };
      });
    }, 250);
  });
</script>

</body>
</html>
