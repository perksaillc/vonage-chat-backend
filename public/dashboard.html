<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chat dashboard</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; height: 100vh; }
  #login { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #login form { width: 280px; display: flex; flex-direction: column; gap: 10px; }
  #login input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #login button { padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #login .error { color: #d33; font-size: 13px; }
  #app { display: none; height: 100vh; }
  #sidebar { width: 300px; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  #sidebar-header { padding: 12px 16px; border-bottom: 1px solid #eee; }
  #sidebar-header .who { font-size: 13px; color: #666; margin-bottom: 8px; }
  #search { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  #session-list { flex: 1; overflow-y: auto; }
  .session { padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
  .session:hover { background: #f5f5f5; }
  .session.active { background: #e8f0fe; }
  .session .name { font-weight: 600; font-size: 14px; }
  .session .preview { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #thread-header { padding: 12px 16px; border-bottom: 1px solid #eee; display: none; justify-content: space-between; align-items: center; }
  #thread-header button { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
  .msg-row { display: flex; flex-direction: column; margin-bottom: 10px; }
  .msg { max-width: 60%; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
  .msg.visitor { background: #f0f0f0; align-self: flex-start; }
  .msg.agent { background: #2563eb; color: #fff; align-self: flex-end; margin-left: auto; }
  .msg.system { background: none; color: #999; font-size: 12px; align-self: center; font-style: italic; }
  .meta { font-size: 11px; color: #999; margin-top: 2px; }
  .msg-row.visitor .meta { align-self: flex-start; }
  .msg-row.agent .meta { align-self: flex-end; }
  #composer { display: none; padding: 12px; border-top: 1px solid #ddd; gap: 8px; }
  #composer input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #composer button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 0 16px; cursor: pointer; font-size: 14px; }
  #empty { padding: 24px; color: #888; }
</style>
</head>
<body>

<div id="login">
  <form id="login-form">
    <h3 style="margin:0 0 6px;">Agent sign in</h3>
    <input id="login-username" placeholder="Username" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <div class="error" id="login-error"></div>
  </form>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <div class="who" id="who"></div>
      <input id="search" placeholder="Search conversations..." />
    </div>
    <div id="session-list"></div>
  </div>
  <div id="main">
    <div id="thread-header">
      <strong id="thread-title"></strong>
      <button id="export-btn">Export</button>
    </div>
    <div id="thread"><div id="empty">Select a conversation</div></div>
    <div id="composer">
      <input id="replyInput" placeholder="Type a reply..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('agentToken');
  let agentName = localStorage.getItem('agentName');
  let ws;
  let sessions = {};
  let activeId = null;
  let activeMessages = [];
  let joinedSessions = new Set();

  function fmtTime(ts) {
    return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    try {
      const res = await fetch('/agent/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) { errEl.textContent = 'Invalid username or password'; return; }
      const data = await res.json();
      token = data.token; agentName = data.name;
      localStorage.setItem('agentToken', token);
      localStorage.setItem('agentName', agentName);
      boot();
    } catch { errEl.textContent = 'Could not reach the server'; }
  });

  function boot() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('who').textContent = 'Signed in as ' + agentName;

    const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${wsProtocol}://${location.host}/agent-ws?token=${token}`);

    ws.onclose = () => {
      localStorage.removeItem('agentToken');
      document.getElementById('login').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'init') { msg.sessions.forEach(s => sessions[s.sessionId] = s); renderSidebar(); }
      if (msg.type === 'session_update') { sessions[msg.session.sessionId] = msg.session; renderSidebar(); }
      if (msg.type === 'message') {
        sessions[msg.sessionId] = sessions[msg.sessionId] || { sessionId: msg.sessionId };
        sessions[msg.sessionId].lastMessage = msg.text;
        sessions[msg.sessionId].lastFrom = msg.from;
        sessions[msg.sessionId].lastActivity = msg.ts;
        if (msg.name) sessions[msg.sessionId].name = msg.name;
        renderSidebar();
        if (msg.sessionId === activeId) { activeMessages.push(msg); renderThread(); }
      }
      if (msg.type === 'history') { if (msg.sessionId === activeId) { activeMessages = msg.messages; renderThread(); } }
    };
  }
  if (token && agentName) boot();

  function renderSidebar(filter) {
    const el = document.getElementById('session-list');
    let list = Object.values(sessions).sort((a, b) => (b.lastActivity || 0) - (a.lastActivity || 0));
    if (filter) {
      const f = filter.toLowerCase();
      list = list.filter(s => (s.name || '').toLowerCase().includes(f) || (s.lastMessage || '').toLowerCase().includes(f));
    }
    el.innerHTML = list.map(s => `
      <div class="session ${s.sessionId === activeId ? 'active' : ''}" data-id="${s.sessionId}">
        <div class="name">${s.name || 'Visitor'}</div>
        <div class="preview">${s.lastFrom === 'agent' ? 'You: ' : ''}${(s.lastMessage || '').replace(/</g,'&lt;')}</div>
      </div>
    `).join('');
    el.querySelectorAll('.session').forEach(node => { node.onclick = () => openSession(node.dataset.id); });
  }

  document.getElementById('search').addEventListener('input', (e) => renderSidebar(e.target.value));

  function openSession(sessionId) {
    activeId = sessionId;
    activeMessages = [];
    document.getElementById('composer').style.display = 'flex';
    document.getElementById('thread-header').style.display = 'flex';
    document.getElementById('thread-title').textContent = (sessions[sessionId] && sessions[sessionId].name) || 'Visitor';
    ws.send(JSON.stringify({ type: 'get_history', sessionId }));
    if (!joinedSessions.has(sessionId)) {
      ws.send(JSON.stringify({ type: 'join', sessionId }));
      joinedSessions.add(sessionId);
    }
    renderSidebar();
    renderThread();
  }

  function renderThread() {
    const el = document.getElementById('thread');
    el.innerHTML = activeMessages.map(m => {
      if (m.from === 'system') return `<div class="msg-row" style="align-items:center;"><div class="msg system">${(m.text||'').replace(/</g,'&lt;')}</div></div>`;
      const label = m.from === 'agent' ? (m.agentName || 'Agent') : (sessions[activeId] && sessions[activeId].name) || 'Visitor';
      return `<div class="msg-row ${m.from}">
        <div class="msg ${m.from}">${(m.text||'').replace(/</g,'&lt;')}</div>
        <div class="meta">${label} · ${fmtTime(m.ts)}</div>
      </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  }

  function sendReply() {
    const input = document.getElementById('replyInput');
    const text = input.value.trim();
    if (!text || !activeId) return;
    ws.send(JSON.stringify({ type: 'reply', sessionId: activeId, text }));
    input.value = '';
  }
  document.getElementById('sendBtn').onclick = sendReply;
  document.getElementById('replyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendReply(); });

  document.getElementById('export-btn').onclick = () => {
    if (!activeId) return;
    const name = (sessions[activeId] && sessions[activeId].name) || 'visitor';
    const lines = activeMessages.map(m => {
      const who = m.from === 'agent' ? (m.agentName || 'Agent') : m.from === 'system' ? 'System' : name;
      return `[${fmtTime(m.ts)}] ${who}: ${m.text}`;
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `conversation-${name}-${activeId}.txt`;
    a.click();
  };
</script>

</body>
</html>
